<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Work by Elias Berg — photography for restaurants, cafés and food events.">
  <title>Our work — Elias Berg</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">Elias Berg</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav">
      <a href="index.html">Home</a>
      <a href="work.html" aria-current="page">Our work</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h1>Our work</h1>
      <p class="lead">A selection of photographs for restaurants, cafés and food events.</p>
    </section>

    <section class="work">
      <div class="filters" role="group" aria-label="Filter work">
        <button class="filter is-active" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" data-filter="restaurant" aria-pressed="false">Restaurants</button>
        <button class="filter" data-filter="cafe" aria-pressed="false">Cafés</button>
        <button class="filter" data-filter="event" aria-pressed="false">Events</button>
      </div>

      <!-- Replace each .placeholder with <img src="images/..." alt="...">.
           data-category must be restaurant, cafe or event. -->
      <div class="grid">
        <figure class="project project--wide" data-category="restaurant">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Restaurant name</span><span>Restaurant</span></figcaption>
        </figure>
        <figure class="project" data-category="cafe">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Café name</span><span>Café</span></figcaption>
        </figure>
        <figure class="project" data-category="restaurant">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Restaurant name</span><span>Restaurant</span></figcaption>
        </figure>
        <figure class="project project--wide" data-category="event">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Event name</span><span>Event</span></figcaption>
        </figure>
        <figure class="project" data-category="cafe">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Café name</span><span>Café</span></figcaption>
        </figure>
        <figure class="project" data-category="event">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Event name</span><span>Event</span></figcaption>
        </figure>
        <figure class="project project--wide" data-category="cafe">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Café name</span><span>Café</span></figcaption>
        </figure>
        <figure class="project" data-category="restaurant">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Restaurant name</span><span>Restaurant</span></figcaption>
        </figure>
        <figure class="project" data-category="event">
          <div class="media"><div class="placeholder"></div></div>
          <figcaption><span>Event name</span><span>Event</span></figcaption>
        </figure>
      </div>
    </section>

    <section class="cta">
      <p class="contact-lead">Want photographs like these for your restaurant, café or event?</p>
      <p class="contact-link"><a href="index.html#contact">Get in touch &rarr;</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Elias Berg</p>
  </footer>

  <div class="lightbox" hidden>
    <button class="lightbox-close" aria-label="Close">Close</button>
    <div class="lightbox-content"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
